version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tct-signalsieve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: signalsieve
      POSTGRES_PASSWORD: signalsieve_prod_password
      POSTGRES_DB: signalsieve
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "random_page_cost=1.1"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalsieve -d signalsieve"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
